name: Feature request
description: Propose a new capability for the trading stack, paper mode, or dashboard.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the desired change and the affected area.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Affected areas
      options:
        - label: Trading node
        - label: Paper trading realism
        - label: Replay/backtest
        - label: Dashboard
        - label: Settlement/redeem

